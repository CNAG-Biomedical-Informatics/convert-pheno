mappingVersion: 2

source:
  profiles: [redcap, cdisc-odm]

target:
  model: beacon
  schemaVersion: '2.0.0'

project:
  id: 3tr_ibd
  version: 3TR-dev-0.1
  description: Mapping file for a REDCap project exported as raw data

defaults:
  ontology: ncit

records:
  visitId:
    sourceField: redcap_event_name
  baseline:
    strategy: firstNonNull
    sourceFields: [ids_complete, consent, consent_date, consent_noneu, consent_devices, consent_recontact, consent_week2_endo, diagnosis, diagnosis_year, used_drug, sex, gender, age, age_first_diagnosis, ethnicity, education, height, consents_and_demographics_complete, comorb_asthma, comorb_copd, comorb_ms, comorb_sle, comorb_ra, comorb_pso, comorb_ad, comorb_cancer, comorb_hypertension, comorb_diabetes, comorb_lipids, comorb_stroke, comorb_other_ai, diet, food_intolerance___1, food_intolerance___2, food_intolerance___3, food_intolerance___4, food_intolerance___5, food_intolerance___6, smoking, alcohol, recreational_drugs, family_history, familymember___1, familymember___2, familymember___3, familymember___4, familymember___5, familymember___6, familymember___7, familymember___8, familymember___9, immunodeficiency, past_surgery, surgery_details___1, surgery_details___2, surgery_details___3, surgery_details___4, surgery_details___5, surgery_details___6, surgery_details___7, surgery_details___8, surgery_details___99, extraintestinal_details___1, extraintestinal_details___2, extraintestinal_details___3, extraintestinal_details___4, extraintestinal_details___5, extraintestinal_details___6, prior_biologics___1, prior_biologics___2, prior_biologics___3, prior_biologics___4, prior_biologics___5, prior_biologics___6, prior_biologics___7, prior_biologics___8, prior_biologics___9, prednisolone_status, prednisolone_dose, prednisolone_duration, prednisolone_start, budesonide_oral_status, budesonide_rectal_status, asa_oral_status, asa_rectal_status, mtx_status, aza_status, mp_status, anamnesis_complete, covid19_complete, response, low_activity, remission, cdeis]

beacon:
  individuals:
    id:
      source:
        fields: [study_id, redcap_event_name]
        primaryKey: study_id
      separator: ':'
      missingValue: NA

    sex:
      source:
        field: sex
      target:
        query: { from: value }

    ethnicity:
      source:
        field: ethnicity
      target:
        query:
          from: value
          aliases:
            Caucasian: White

    diseases:
      - source:
          field: diagnosis
          when: { nonEmpty: true }
        target:
          diseaseCode:
            query:
              from: value
              aliases:
                'Ulcerative Colitis (UC)': Ulcerative Colitis
                "Crohn's Disease (CD)": Crohn Disease
          ageOfOnset:
            sourceField: age_first_diagnosis
          familyHistory:
            sourceField: family_history

    exposures:
      - source:
          field: alcohol
          when: { notValues: ['No', 'False'] }
        target:
          exposureCode:
            query: { literal: Alcohol }
          unit:
            query:
              from: value
              aliases:
                Non-drinker: Non-Drinker
                Ex-drinker: Current non-drinker with Past Alcohol Consumption
                occasional drinking: Alcohol Consumption Equal to or Less than 2 Drinks per Day for Men and 1 Drink or Less per Day for Women
                regular drinking: Alcohol Consumption More than 2 Drinks per Day for Men and More than 1 Drink per Day for Women
                unknown: Unknown
      - source:
          field: smoking
          when: { notValues: ['No', 'False'] }
        target:
          exposureCode:
            query: { literal: Smoking }
          unit:
            query:
              from: value
              aliases:
                Never smoked: Never Smoker
                Ex-smoker: Former Smoker
                Current smoker: Current Smoker
      - source: { field: cigarettes_days }
        target:
          exposureCode:
            query: { literal: Average Number Cigarettes Smoked a Day }
          unit:
            query: { from: value }
      - source: { field: cigarettes_years }
        target:
          exposureCode:
            query: { literal: Total Years Have Smoked Cigarettes }
          unit:
            query: { from: value }
      - source: { field: packyears }
        target:
          exposureCode:
            query: { literal: Pack Year }
          unit:
            query: { from: value }
      - source: { field: smoking_quit }
        target:
          exposureCode:
            query: { literal: Smoking Cessation Year }
          unit:
            query: { from: value }

    info:
      source:
        fields: [study_id, dob, diet, redcap_event_name, age, first_name, last_name, consent, consent_date, consent_noneu, consent_devices, consent_recontact, consent_week2_endo, education, zipcode, consents_and_demographics_complete]
      target:
        ageRange:
          sourceField: age

    interventionsOrProcedures:
      - source: { field: surgery_details___1 }
        target:
          procedureCode: { query: { literal: Ileocolectomy } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: surgery_details___2 }
        target:
          procedureCode: { query: { literal: Colostomy } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: surgery_details___3 }
        target:
          procedureCode: { query: { literal: Ileostomy } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: surgery_details___4 }
        target:
          procedureCode: { query: { literal: Fistula Repair } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: surgery_details___5 }
        target:
          procedureCode: { query: { literal: Colectomy } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: surgery_details___6 }
        target:
          procedureCode: { query: { literal: Hemicolectomy } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: surgery_details___7 }
        target:
          procedureCode: { query: { literal: Colon Resection } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: surgery_details___8 }
        target:
          procedureCode: { query: { literal: Strictureplasty } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: surgery_details___99 }
        target:
          procedureCode: { query: { literal: Other } }
          bodySite: { query: { literal: Intestine } }
      - source: { field: endoscopy_performed }
        target:
          procedureCode: { query: { literal: Gastrointestinal Endoscopy } }
          dateOfProcedure: { sourceField: endoscopy_date }
      - source: { field: endoscopy_complete }
        target:
          procedureCode: { query: { from: value } }
      - source: { field: intestinal_surgery }
        target:
          procedureCode: { query: { from: value } }
      - source: { field: partial_mayo }
        target:
          procedureCode: { query: { from: value } }
      - source: { field: complete_mayo }
        target:
          procedureCode: { query: { from: value } }
      - source: { field: prev_endosc_dilatation }
        target:
          procedureCode: { query: { from: value } }

    measures:
      - &bloodMeasure
        source: { field: leucocytes }
        target:
          assayCode: { query: { literal: Leukocyte Count } }
          measurementValue:
            quantity:
              unit: &redcapUnit
                query:
                  from: fieldNote
                  aliases: &unitAliases
                    'xx.xx /10^-9 l': Cells per Microliter
                    'x.xx /10^-9 l': Cells per Microliter
                    'xxxx /10^-9 l': Cells per Microliter
                    'xx.x g/dl': Gram per Deciliter
                    'xx.x fl': Femtoliter
                    'xx.x': Picogram
                    'xx.x pg': Picogram
                    'xx.x µmol/l': Micromole per Liter
                    'xxx.x µmol/l': Micromole per Liter
                    'xxx µmol/l': Micromole per Liter
                    'ml/min/1.73': Glomerular Filtration Rate Adjusted for BSA
                    'xxx ml/min/1.73': Glomerular Filtration Rate Adjusted for BSA
                    'xx.x U/l': International Unit per Liter
                    'pg/dl': Picogram per Deciliter
                    'mg/dl': Milligram per Deciliter
                    'xxx.x mg/l': Milligram per Liter per Milligram
                    'µg/dl': Microgram per Deciliter
                    'ng/dl': Nanogram per Deciliter
                    'xxxx.x ng/l': Nanogram per Liter
                    'mg/kg stool': Microgram per Kilogram
                    'xx.x %': Percentage
              referenceRange: { from: redcapDictionary }
          procedure: &bloodProcedure
            procedureCode: { query: { literal: Blood Test Result } }
      - source: { field: hemoglobin }
        target:
          assayCode: { query: { literal: Hemoglobin Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: hematokrit }
        target:
          assayCode: { query: { literal: Hematocrit Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: mcv }
        target:
          assayCode: { query: { literal: Erythrocyte Mean Corpuscular Volume } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: mhc }
        target:
          assayCode: { query: { literal: Erythrocyte Mean Corpuscular Hemoglobin } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: thrombocytes }
        target:
          assayCode: { query: { literal: Platelet Count } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: neutrophils }
        target:
          assayCode: { query: { literal: Neutrophil Count } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: lymphocytes }
        target:
          assayCode: { query: { literal: Lymphocyte Count } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: eosinophils }
        target:
          assayCode: { query: { literal: Eosinophil Count } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: creatinine }
        target:
          assayCode: { query: { literal: Creatinine Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: gfr }
        target:
          assayCode: { query: { literal: Glomerular Filtration Rate } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: bilirubin }
        target:
          assayCode: { query: { literal: Total Bilirubin Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: gpt }
        target:
          assayCode: { query: { literal: 'Serum Glutamic Pyruvic Transaminase, CTCAE' } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: ggt }
        target:
          assayCode: { query: { literal: Serum Gamma Glutamyl Transpeptidase Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: lipase }
        target:
          assayCode: { query: { literal: Lipase Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: crp }
        target:
          assayCode: { query: { literal: C-Reactive Protein Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: iron }
        target:
          assayCode: { query: { literal: Iron Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: il6 }
        target:
          assayCode: { query: { literal: Interleukin-6 } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure
      - source: { field: calprotectin }
        target:
          assayCode: { query: { literal: Calprotectin Measurement } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure:
            procedureCode: { query: { literal: Feces } }
      - source: { field: nancy_index_acute }
        target:
          assayCode: { query: { literal: nancy_index_acute } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: &histologyProcedure
            procedureCode: { query: { literal: Histologic } }
      - source: { field: nancy_index_chronic }
        target:
          assayCode: { query: { literal: nancy_index_chronic } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *histologyProcedure
      - source: { field: nancy_index_ulceration }
        target:
          assayCode: { query: { literal: nancy_index_ulceration } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *histologyProcedure
      - source: { field: endo_mayo }
        target:
          assayCode: { query: { literal: endo_mayo } }
          measurementValue: { quantity: { unit: *redcapUnit, referenceRange: { from: redcapDictionary } } }
          procedure: *bloodProcedure

    phenotypicFeatures:
      - source: { field: comorb_asthma }
        target: { featureType: { query: { literal: Asthma } } }
      - source: { field: comorb_copd }
        target: { featureType: { query: { literal: Chronic Obstructive Pulmonary Disease } } }
      - source: { field: comorb_ms }
        target: { featureType: { query: { literal: Multiple Sclerosis } } }
      - source: { field: comorb_sle }
        target: { featureType: { query: { literal: Systemic Lupus Erythematosus } } }
      - source: { field: comorb_ra }
        target: { featureType: { query: { literal: Rheumatoid Arthritis } } }
      - source: { field: comorb_pso }
        target: { featureType: { query: { literal: Psoriasis } } }
      - source: { field: comorb_ad }
        target: { featureType: { query: { literal: Atopy } } }
      - source: { field: comorb_cancer }
        target: { featureType: { query: { literal: Cancer Diagnosis } } }
      - source:
          field: comorb_cancer_specified
          when: { nonEmpty: true }
        target:
          featureType:
            query:
              from: value
              aliases: { cancer: Cancer Patient }
      - source: { field: comorb_hypertension }
        target: { featureType: { query: { literal: Hypertension } } }
      - source: { field: comorb_diabetes }
        target: { featureType: { query: { literal: Diabetes Mellitus } } }
      - source: { field: comorb_lipids }
        target: { featureType: { query: { literal: Dyslipidemia } } }
      - source: { field: comorb_stroke }
        target: { featureType: { query: { literal: Stroke } } }
      - source: { field: comorb_other_ai }
        target: { featureType: { query: { literal: Other } } }
      - source:
          field: comorb_other_ai_specified
          when: { nonEmpty: true }
        target:
          featureType:
            query:
              from: value
              aliases:
                atopic dermatitis: eczema
                COPD: Chronic Obstructive Pulmonary Disease
                'demyelating disease/multiple sclerosis': Multiple Sclerosis
                'Hyper-/dyslipidemia': Dyslipidemia
      - source: { field: immunodeficiency }
        target: { featureType: { query: { literal: Primary Immunodeficiency Syndrome } } }
      - source: { field: rectal_bleeding }
        target: { featureType: { query: { literal: Rectal Hemorrhage } } }

    treatments:
      - source: &activeAsa
          field: asa_oral_status
          when: { values: [former treatment, current treatment] }
        target:
          treatmentCode: { query: { literal: aspirin } }
          routeOfAdministration: &oralRoute
            query: { literal: Oral Route of Administration }
          cumulativeDose:
            value: { sourceField: asa_oral_duration }
            unit: &weekUnit
              query: { literal: Week }
          doseIntervals:
            quantity:
              value: { sourceField: asa_oral_dose }
              unit: &milligramUnit
                query: { literal: Milligram }
      - source:
          field: aza_status
          when: { values: [former treatment, current treatment] }
        target:
          treatmentCode: { query: { literal: azathioprine } }
          routeOfAdministration: *oralRoute
          cumulativeDose: { value: { sourceField: aza_duration }, unit: *weekUnit }
          doseIntervals: { quantity: { value: { sourceField: aza_dose }, unit: *milligramUnit } }
      - source:
          field: mtx_status
          when: { values: [former treatment, current treatment] }
        target:
          treatmentCode: { query: { literal: methotrexate } }
          routeOfAdministration: *oralRoute
          cumulativeDose: { value: { sourceField: mtx_duration }, unit: *weekUnit }
          doseIntervals: { quantity: { value: { sourceField: mtx_dose }, unit: *milligramUnit } }
      - source:
          field: mp_status
          when: { values: [former treatment, current treatment] }
        target:
          treatmentCode: { query: { literal: mercaptopurine } }
          routeOfAdministration: *oralRoute
          cumulativeDose: { value: { sourceField: mp_duration }, unit: *weekUnit }
          doseIntervals: { quantity: { value: { sourceField: mp_dose }, unit: *milligramUnit } }
      - source:
          field: prednisolone_status
          when: { values: [former treatment, current treatment] }
        target:
          treatmentCode: { query: { literal: prednisolone } }
          routeOfAdministration: *oralRoute
          cumulativeDose: { value: { sourceField: prednisolone_duration }, unit: *weekUnit }
          doseIntervals: { quantity: { value: { sourceField: prednisolone_dose }, unit: *milligramUnit } }

  biosamples:
    mappings:
      - source: { field: id_pbmc, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: &unknownStatus
            term: { id: 'NCIT:C126101', label: Not Available }
          sampleOriginType:
            query: { literal: Peripheral Blood Mononuclear Cell }
          collectionDate: { sourceField: study_blood_date }
          info: { sourceFields: [number_pbmc, study_blood_remarks] }
      - source: { field: id_heparin, optional: true, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: &wholeBlood
            query: { literal: Whole Blood }
          collectionDate: { sourceField: study_blood_date }
          info: { sourceFields: [number_heparin, study_blood_remarks] }
      - source: { field: id_smart, optional: true, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *wholeBlood
          collectionDate: { sourceField: study_blood_date }
          info: { sourceFields: [number_smart, study_blood_remarks] }
      - source: { field: id_serum, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType:
            query: { literal: Serum }
          collectionDate: { sourceField: study_blood_date }
          info: { sourceFields: [number_serum, study_blood_remarks] }
      - source: { field: id_cispt, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *wholeBlood
          collectionDate: { sourceField: study_blood_date }
          info: { sourceFields: [number_cispt, study_blood_remarks] }
      - source: { field: id_plasma, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType:
            query: { literal: Plasma }
          collectionDate: { sourceField: study_blood_date }
          info: { sourceFields: [number_plasma, study_blood_remarks] }
      - source: { field: id_pax, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *wholeBlood
          collectionDate: { sourceField: study_blood_date }
          info: { sourceFields: [number_pax, study_blood_remarks] }
      - &nativeBiopsy
        source: { field: id_least_bio_native, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: &tissue
            query: { literal: Tissue }
          collectionDate: { sourceField: endoscopy_date }
          info: { sourceFields: [number_least_bio_native, biopsy_remarks] }
      - source: { field: id_least_bio_native_2, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *tissue
          collectionDate: { sourceField: endoscopy_date }
          info: { sourceFields: [number_least_bio_native_2, biopsy_remarks] }
      - source: { field: id_least_bio_freezing, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *tissue
          collectionDate: { sourceField: endoscopy_date }
          info: { sourceFields: [number_least_bio_freezing, biopsy_remarks] }
      - source: { field: id_least_bio_freezing_2, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *tissue
          collectionDate: { sourceField: endoscopy_date }
          info: { sourceFields: [number_least_bio_freezing_2, biopsy_remarks] }
      - source: { field: id_most_bio_native, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *tissue
          collectionDate: { sourceField: endoscopy_date }
          info: { sourceFields: [number_most_bio_native, biopsy_remarks] }
      - source: { field: id_most_bio_native_2, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *tissue
          collectionDate: { sourceField: endoscopy_date }
          info: { sourceFields: [number_most_bio_native_2, biopsy_remarks] }
      - source: { field: id_most_bio_freezing, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *tissue
          collectionDate: { sourceField: endoscopy_date }
          info: { sourceFields: [number_most_bio_freezing, biopsy_remarks] }
      - source: { field: id_most_bio_freezing_2, when: { nonEmpty: true } }
        target:
          id: { from: sourceValue }
          individualId: { from: individualId }
          biosampleStatus: *unknownStatus
          sampleOriginType: *tissue
          collectionDate: { sourceField: endoscopy_date }
          info: { sourceFields: [number_most_bio_freezing_2, biopsy_remarks] }
