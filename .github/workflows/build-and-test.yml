name: Build and test
 
on:
     workflow_dispatch
#    push:
#        branches: 'main'
#    pull_request:
#        branches: '*'
#    schedule:
#        - cron: '42 5 * * 0'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        #os: ['ubuntu-latest', 'macos-latest', 'windows-2019']
        perl: ['5.42', '5.40', '5.38', '5.36', '5.34', '5.32', '5.30']
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Run tests (no coverage)
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - run: perl -V
      - run: cpanm -n --installdeps .
      - run: prove -j6 -lr t
      - name: Run extended suite
        if: ${{ matrix.perl == '5.42' && matrix.os == 'ubuntu-latest' }}
        run: prove -j6 -lr t xt
      - name: Run tests (with coverage)
        if: ${{ matrix.perl == '5.30' && matrix.os == 'ubuntu-latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          perl Makefile.PL
          cpanm -n Devel::Cover::Report::Coveralls
          cover -test -report Coveralls

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            docs-site/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Typecheck, test, and build frontend
        working-directory: app
        run: npm run typecheck && npm test && npm run build
      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build documentation
        working-directory: docs-site
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build runtime image
        run: docker build --file docker/Dockerfile --tag convert-pheno:ci .
      - name: Smoke test CLI and API
        run: |
          docker run --rm convert-pheno:ci convert-pheno --version
          docker run --detach --name convert-pheno-ci --publish 127.0.0.1:18080:8080 \
            --env CONVERT_PHENO_API_TOKEN=0123456789abcdef0123456789abcdef \
            convert-pheno:ci hypnotoad -f api/perl/main.pl
          trap 'docker rm --force convert-pheno-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent \
              --header 'Authorization: Bearer 0123456789abcdef0123456789abcdef' \
              http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent \
            --header 'Authorization: Bearer 0123456789abcdef0123456789abcdef' \
            http://127.0.0.1:18080/api/health \
            | python3 -c 'import json, pathlib, sys; body=json.load(sys.stdin); assert body["ok"] and body["data"]["version"] == pathlib.Path("VERSION").read_text().strip()'
