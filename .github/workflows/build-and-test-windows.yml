name: Build and test Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.42', '5.40']
    name: Perl ${{ matrix.perl }} on Windows
    steps:
      - uses: actions/checkout@v5

      # Strawberry Perl supplies a compiler and runtime built as one toolchain.
      # Mixing the runner's MinGW with another Perl build caused the historical
      # XS linker and "loadable library ... mismatched" failures.
      - name: Set up Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: strawberry

      - name: Show Perl and compiler toolchain
        shell: pwsh
        run: |
          Get-Command perl
          Get-Command cpanm
          Get-Command gcc
          perl -V
          perl -MConfig -e 'print qq{Compiler: $Config{cc}\nArchitecture: $Config{archname}\n}'

      # Net::IDN::Encode 2.500 calls a Perl C API removed in Perl 5.38.
      # Remove this pin once https://github.com/cfaerber/Net-IDN-Encode/pull/11
      # is included in a CPAN release.
      - name: Install Net::IDN::Encode compatibility patch
        shell: pwsh
        run: cpanm --verbose --notest https://github.com/ernix/Net-IDN-Encode/archive/3ebe6f2e239b470efcb64a044edc8202798188af.tar.gz

      - name: Install dependencies
        shell: pwsh
        run: cpanm --verbose --notest --installdeps .

      - name: Run tests
        shell: pwsh
        timeout-minutes: 5
        run: prove -lv t/25-json-bridge.t t/29-atomic-output.t
