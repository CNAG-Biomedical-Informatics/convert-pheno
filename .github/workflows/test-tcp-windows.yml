name: Diagnose Test-TCP on Windows Perl 5.42

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tcp:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.42'
          distribution: strawberry

      # Reproduce the upstream release involved in the clean-install hang.
      # This is diagnostic only: no dependency pins or test skips in the package.
      - name: Install and test dependencies with normal TAP settings
        shell: pwsh
        timeout-minutes: 6
        env:
          PERL_CPANM_HOME: ${{ runner.temp }}/cpanm
        run: |
          perl -V
          cpanm --verbose --configure-timeout 300 --test-timeout 300 Test::SharedFork
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep HARNESS_VERBOSE out of SharedFork's nested test harness.
      - name: Install and test Test-TCP 2.22 with verbose TAP
        shell: pwsh
        timeout-minutes: 12
        env:
          PERL_CPANM_HOME: ${{ runner.temp }}/cpanm
          HARNESS_VERBOSE: '1'
        run: |
          perl -V
          cpanm --verbose --configure-timeout 300 --test-timeout 600 https://www.cpan.org/authors/id/M/MI/MIYAGAWA/Test-TCP-2.22.tar.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-tcp-windows-perl-5.42-logs
          path: ${{ runner.temp }}/cpanm/work/**/build.log
          if-no-files-found: warn
