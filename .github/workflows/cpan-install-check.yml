name: Check CPAN distribution installation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to package and test without publishing
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - name: Build the release archive
        run: |
          perl scripts/check-release.pl
          cpanm --notest File::ShareDir::Install ExtUtils::MakeMaker
          perl Makefile.PL
          make manifest
          make dist
          sha256sum Convert-Pheno-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cpan-distribution
          path: Convert-Pheno-*.tar.gz
          if-no-files-found: error

  installation:
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            perl: '5.40'
            distribution: strawberry
          - os: windows-latest
            perl: '5.42'
            distribution: strawberry
          - os: macos-15
            perl: '5.34'
            distribution: default
          - os: macos-15
            perl: '5.42'
            distribution: default
          - os: ubuntu-24.04-arm
            perl: '5.34'
            distribution: default
    name: Install on ${{ matrix.os }} / Perl ${{ matrix.perl }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ matrix.distribution }}
      - uses: actions/download-artifact@v5
        with:
          name: cpan-distribution
          path: distribution
      # Install the tarball, not a checkout or a hand-maintained dependency list.
      # No patched Net::IDN::Encode, compiler overrides, force, or skipped tests.
      - name: Install and test the distribution
        shell: bash
        env:
          PERL_CPANM_HOME: ${{ runner.temp }}/cpanm
        run: |
          perl -V
          perl -e 'for my $module (qw(ExtUtils::MakeMaker Pod::Man)) { my $ok = eval "require $module; 1"; print "$module: ", ($ok ? $module->VERSION : "missing ($@)"), "\n" }'
          cpanm --verbose --configure-timeout 300 distribution/Convert-Pheno-*.tar.gz
      - name: Preserve dependency and distribution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpan-logs-${{ matrix.os }}-${{ matrix.perl }}
          path: ${{ runner.temp }}/cpanm/work/**/build.log
          if-no-files-found: warn
