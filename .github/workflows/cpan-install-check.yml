name: Check CPAN distribution installation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to package and test without publishing
        required: true
        default: main
        type: string
      cygwin_dependencies_only:
        description: Diagnose Cygwin dependencies only (not a release check)
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
      - name: Build the release archive
        run: |
          perl scripts/check-release.pl
          cpanm --notest File::ShareDir::Install ExtUtils::MakeMaker
          perl Makefile.PL
          make manifest
          make dist
          sha256sum Convert-Pheno-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cpan-distribution
          path: Convert-Pheno-*.tar.gz
          if-no-files-found: error

  installation:
    needs: distribution
    if: ${{ !inputs.cygwin_dependencies_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            perl: '5.40'
            distribution: strawberry
          - os: windows-latest
            perl: '5.42'
            distribution: strawberry
          - os: macos-15
            perl: '5.34'
            distribution: default
          - os: macos-15
            perl: '5.42'
            distribution: default
          - os: ubuntu-24.04-arm
            perl: '5.34'
            distribution: default
    name: Install on ${{ matrix.os }} / Perl ${{ matrix.perl }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ matrix.distribution }}
      - uses: actions/download-artifact@v5
        with:
          name: cpan-distribution
          path: distribution
      # Install the tarball, not a checkout or a hand-maintained dependency list.
      # No patched Net::IDN::Encode, compiler overrides, force, or skipped tests.
      - name: Install and test the distribution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PERL_CPANM_HOME: ${{ runner.temp }}/cpanm
        run: |
          perl -V
          perl -e 'for my $module (qw(ExtUtils::MakeMaker Pod::Man)) { my $ok = eval "require $module; 1"; print "$module: ", ($ok ? $module->VERSION : "missing ($@)"), "\n" }'
          $archive = (Get-ChildItem -Path 'distribution/Convert-Pheno-*.tar.gz').FullName
          cpanm --verbose --configure-timeout 300 $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and test the distribution on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          PERL_CPANM_HOME: ${{ runner.temp }}/cpanm
        run: |
          perl -V
          perl -e 'for my $module (qw(ExtUtils::MakeMaker Pod::Man)) { my $ok = eval "require $module; 1"; print "$module: ", ($ok ? $module->VERSION : "missing ($@)"), "\n" }'
          cpanm --verbose --configure-timeout 300 distribution/Convert-Pheno-*.tar.gz
      - name: Preserve dependency and distribution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpan-logs-${{ matrix.os }}-${{ matrix.perl }}
          path: ${{ runner.temp }}/cpanm/work/**/build.log
          if-no-files-found: warn

  cygwin:
    needs: distribution
    name: Install on Cygwin
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Keep native Windows tools and Strawberry Perl out of Cygwin's PATH.
      CYGWIN_NOWINPATH: 1
      CHERE_INVOKING: 1
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: cpan-distribution
          path: distribution
      - name: Install Cygwin build environment
        uses: cygwin/cygwin-install-action@3f0a3f9f988f7e96b8c18098ae05eaec175f5b52 # v6.1
        with:
          install-dir: C:\cygwin
          add-to-path: false
          # Cygwin Perl headers include crypt.h when compiling XS modules.
          packages: >-
            curl
            gcc-core
            gcc-g++
            libcrypt-devel
            libexpat-devel
            libsqlite3-devel
            libssl-devel
            libxml2-devel
            make
            perl
            pkg-config
            zlib-devel
      - name: Install and test the distribution on Cygwin
        shell: C:\cygwin\bin\bash.EXE --noprofile --norc -e -o igncr -o pipefail {0}
        env:
          DEPENDENCIES_ONLY: ${{ inputs.cygwin_dependencies_only }}
        run: |
          export PATH=/usr/local/bin:/usr/bin
          export PERL_CPANM_HOME=/tmp/cpanm
          unset PERL5LIB PERL_LOCAL_LIB_ROOT PERL_MB_OPT PERL_MM_OPT
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          perl -V
          curl --fail --location https://cpanmin.us | perl - App::cpanminus
          if [[ "$DEPENDENCIES_ONLY" == "true" ]]; then
            id
            mount
            ulimit -a
            perl -MFile::Temp=tempfile -e 'my ($fh, $path) = tempfile(UNLINK => 1); close $fh; chmod(0200, $path) or die "chmod: $!"; my $readable = open(my $in, "<", $path); printf "Permission probe: uid=%s mode=%04o readable=%s\n", $>, (stat($path))[2] & 07777, $readable ? "yes" : "no"; chmod(0600, $path) or die "restore permissions: $!";'
            failed=0
            # Separate invocations expose each failure instead of dependency cascades.
            for module in Clone Module::Pluggable Test::TCP; do
              echo "::group::Cygwin dependency: $module"
              if ! cpanm --verbose --configure-timeout 300 "$module"; then
                failed=1
              fi
              echo "::endgroup::"
            done
            exit "$failed"
          fi
          cpanm --verbose --configure-timeout 300 distribution/Convert-Pheno-*.tar.gz
      - name: Preserve Cygwin dependency and distribution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpan-logs-cygwin
          path: C:\cygwin\tmp\cpanm\work\**\build.log
          if-no-files-found: warn
