<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Representative OMOP relational joins</title>
  <desc id="description">Clinical tables join to PERSON through person_id, while concept identifiers resolve through the CONCEPT vocabulary table.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60747d"/>
    </marker>
    <marker id="concept-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c56e28"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="318" rx="8" fill="#ffffff" stroke="#d6e1e5" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" fill="#49616c" font-size="13" font-weight="700">CLINICAL EVENT TABLES</text>
    <text x="282" y="28" fill="#49616c" font-size="13" font-weight="700">PERSON KEY</text>
    <text x="522" y="28" fill="#49616c" font-size="13" font-weight="700">VOCABULARY LOOKUP</text>

    <g font-family="monospace">
      <rect x="24" y="49" width="205" height="48" rx="6" fill="#f3f8fb" stroke="#6d98b4"/>
      <circle cx="44" cy="73" r="5" fill="#e58a3d"/>
      <text x="58" y="78" fill="#315f82" font-size="13" font-weight="700">CONDITION_OCCURRENCE</text>
      <rect x="24" y="112" width="205" height="48" rx="6" fill="#f3f8fb" stroke="#6d98b4"/>
      <circle cx="44" cy="136" r="5" fill="#e58a3d"/>
      <text x="58" y="141" fill="#315f82" font-size="13" font-weight="700">MEASUREMENT</text>
      <rect x="24" y="175" width="205" height="48" rx="6" fill="#f3f8fb" stroke="#6d98b4"/>
      <circle cx="44" cy="199" r="5" fill="#e58a3d"/>
      <text x="58" y="204" fill="#315f82" font-size="13" font-weight="700">DRUG_EXPOSURE</text>
      <rect x="24" y="238" width="205" height="48" rx="6" fill="#f3f8fb" stroke="#6d98b4"/>
      <circle cx="44" cy="262" r="5" fill="#e58a3d"/>
      <text x="58" y="267" fill="#315f82" font-size="13" font-weight="700">SPECIMEN</text>
    </g>

    <path d="M229 73H254M229 136H254M229 199H254M229 262H254M254 73V262" fill="none" stroke="#60747d" stroke-width="2"/>
    <path d="M254 168H278" fill="none" stroke="#60747d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="238" y="304" fill="#60747d" font-family="monospace" font-size="12">person_id</text>

    <rect x="282" y="112" width="190" height="112" rx="7" fill="#eff9f3" stroke="#58a27b" stroke-width="2"/>
    <rect x="282" y="112" width="190" height="40" rx="7" fill="#2f9665"/>
    <text x="304" y="138" fill="#ffffff" font-family="monospace" font-size="17" font-weight="700">PERSON</text>
    <text x="304" y="178" fill="#276749" font-family="monospace" font-size="13">person_id</text>
    <text x="304" y="201" fill="#536871" font-size="12">birth · sex · race · ethnicity</text>

    <rect x="522" y="112" width="174" height="112" rx="7" fill="#fff7ef" stroke="#d99355" stroke-width="2"/>
    <rect x="522" y="112" width="174" height="40" rx="7" fill="#e58a3d"/>
    <text x="544" y="138" fill="#ffffff" font-family="monospace" font-size="17" font-weight="700">CONCEPT</text>
    <text x="544" y="178" fill="#8c4d1d" font-family="monospace" font-size="13">concept_id</text>
    <text x="544" y="201" fill="#536871" font-size="12">label · vocabulary · code</text>

    <path d="M472 168H516" fill="none" stroke="#c56e28" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#concept-arrow)"/>

    <line x1="421" y1="303" x2="463" y2="303" stroke="#60747d" stroke-width="2"/>
    <text x="471" y="307" fill="#60747d" font-size="11">record joins</text>
    <line x1="558" y1="303" x2="600" y2="303" stroke="#c56e28" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="608" y="307" fill="#60747d" font-size="11">terminology resolution</text>
  </g>
</svg>
