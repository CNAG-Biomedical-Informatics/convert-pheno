<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title description">
  <title id="title">Dataset-XML metadata resolution and participant grouping</title>
  <desc id="description">Define-XML resolves Dataset-XML domain columns before SDTM rows are grouped by USUBJID and converted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60747d"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="8" fill="#ffffff" stroke="#d6e1e5" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" fill="#49616c" font-size="13" font-weight="700">XML DATASETS + METADATA</text>
    <text x="383" y="28" fill="#49616c" font-size="13" font-weight="700" text-anchor="middle">RESOLVE AND GROUP</text>
    <text x="536" y="28" fill="#49616c" font-size="13" font-weight="700">REQUESTED OUTPUT</text>

    <rect x="24" y="50" width="220" height="213" rx="7" fill="#fffaf0" stroke="#b59b42" stroke-width="2"/>
    <rect x="44" y="69" width="180" height="42" rx="5" fill="#ffffff" stroke="#c7b46d"/>
    <text x="134" y="88" text-anchor="middle" fill="#735f18" font-family="monospace" font-size="12" font-weight="700">define.xml</text>
    <text x="134" y="103" text-anchor="middle" fill="#60747d" font-size="10">domains, columns, types</text>
    <g font-family="monospace" font-size="12" font-weight="700">
      <rect x="44" y="128" width="80" height="38" rx="5" fill="#ffffff" stroke="#c7b46d"/>
      <text x="84" y="152" text-anchor="middle" fill="#735f18">dm.xml</text>
      <rect x="144" y="128" width="80" height="38" rx="5" fill="#ffffff" stroke="#c7b46d"/>
      <text x="184" y="152" text-anchor="middle" fill="#735f18">mh.xml</text>
      <rect x="44" y="181" width="80" height="38" rx="5" fill="#ffffff" stroke="#c7b46d"/>
      <text x="84" y="205" text-anchor="middle" fill="#735f18">lb.xml</text>
      <rect x="144" y="181" width="80" height="38" rx="5" fill="#ffffff" stroke="#c7b46d"/>
      <text x="184" y="205" text-anchor="middle" fill="#735f18">...</text>
    </g>
    <text x="134" y="244" text-anchor="middle" fill="#60747d" font-size="10">one Dataset-XML file per domain</text>

    <path d="M244 156H278" fill="none" stroke="#60747d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="286" y="67" width="194" height="178" rx="7" fill="#f3f8fb" stroke="#6d98b4" stroke-width="2"/>
    <text x="383" y="91" text-anchor="middle" fill="#315f82" font-size="11">ItemOID to SDTM column</text>
    <text x="383" y="108" text-anchor="middle" fill="#315f82" font-family="monospace" font-size="13" font-weight="700">USUBJID</text>
    <rect x="307" y="121" width="152" height="42" rx="6" fill="#ffffff" stroke="#91adbd"/>
    <text x="326" y="140" fill="#315f82" font-family="monospace" font-size="12" font-weight="700">P001</text>
    <text x="326" y="154" fill="#60747d" font-size="10">DM · MH · LB</text>
    <rect x="307" y="176" width="152" height="42" rx="6" fill="#ffffff" stroke="#91adbd"/>
    <text x="326" y="195" fill="#315f82" font-family="monospace" font-size="12" font-weight="700">P002</text>
    <text x="326" y="209" fill="#60747d" font-size="10">DM · MH · LB</text>
    <text x="383" y="235" text-anchor="middle" fill="#60747d" font-size="10">one normalized individual per DM row</text>

    <path d="M480 156H528" fill="none" stroke="#60747d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="536" y="50" width="160" height="213" rx="7" fill="#eff9f3" stroke="#58a27b" stroke-width="2"/>
    <rect x="557" y="76" width="118" height="45" rx="6" fill="#ffffff" stroke="#79b194"/>
    <text x="616" y="104" text-anchor="middle" fill="#276749" font-size="14" font-weight="700">BFF JSON</text>
    <rect x="557" y="134" width="118" height="45" rx="6" fill="#fff7f2" stroke="#df825f"/>
    <text x="616" y="162" text-anchor="middle" fill="#a84f30" font-size="14" font-weight="700">PXF JSON</text>
    <rect x="557" y="192" width="118" height="45" rx="6" fill="#f3f8fb" stroke="#6d98b4"/>
    <text x="616" y="220" text-anchor="middle" fill="#315f82" font-size="14" font-weight="700">OMOP CSV</text>
  </g>
</svg>
