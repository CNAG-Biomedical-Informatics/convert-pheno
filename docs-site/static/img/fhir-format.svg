<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title description">
  <title id="title">FHIR R4 Bundle patient grouping</title>
  <desc id="description">FHIR Bundle resources are resolved by reference, grouped by Patient, and converted to BFF, PXF, or OMOP-CDM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60747d"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="8" fill="#ffffff" stroke="#d6e1e5" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="28" fill="#49616c" font-size="13" font-weight="700">FHIR R4 BUNDLE</text>
    <text x="383" y="28" fill="#49616c" font-size="13" font-weight="700" text-anchor="middle">RESOLVE BY PATIENT</text>
    <text x="536" y="28" fill="#49616c" font-size="13" font-weight="700">REQUESTED OUTPUT</text>

    <rect x="24" y="50" width="220" height="213" rx="7" fill="#fff6f6" stroke="#c85f67" stroke-width="2"/>
    <rect x="44" y="70" width="180" height="40" rx="5" fill="#ffffff" stroke="#db8990"/>
    <text x="134" y="95" text-anchor="middle" fill="#9f3039" font-family="monospace" font-size="13" font-weight="700">Patient</text>
    <rect x="44" y="123" width="82" height="36" rx="5" fill="#ffffff" stroke="#db8990"/>
    <text x="85" y="146" text-anchor="middle" fill="#713c42" font-size="11">Condition</text>
    <rect x="142" y="123" width="82" height="36" rx="5" fill="#ffffff" stroke="#db8990"/>
    <text x="183" y="146" text-anchor="middle" fill="#713c42" font-size="11">Observation</text>
    <rect x="44" y="171" width="82" height="36" rx="5" fill="#ffffff" stroke="#db8990"/>
    <text x="85" y="194" text-anchor="middle" fill="#713c42" font-size="11">Procedure</text>
    <rect x="142" y="171" width="82" height="36" rx="5" fill="#ffffff" stroke="#db8990"/>
    <text x="183" y="194" text-anchor="middle" fill="#713c42" font-size="11">Medication</text>
    <rect x="44" y="219" width="82" height="30" rx="5" fill="#ffffff" stroke="#db8990"/>
    <text x="85" y="239" text-anchor="middle" fill="#713c42" font-size="11">Specimen</text>
    <rect x="142" y="219" width="82" height="30" rx="5" fill="#ffffff" stroke="#db8990"/>
    <text x="183" y="239" text-anchor="middle" fill="#713c42" font-size="11">Study &#183; Group</text>

    <path d="M244 156H278" fill="none" stroke="#60747d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="286" y="67" width="194" height="178" rx="7" fill="#f3f8fb" stroke="#6d98b4" stroke-width="2"/>
    <text x="383" y="94" text-anchor="middle" fill="#315f82" font-family="monospace" font-size="14" font-weight="700">Patient/id</text>
    <rect x="307" y="112" width="152" height="45" rx="6" fill="#ffffff" stroke="#91adbd"/>
    <text x="383" y="132" text-anchor="middle" fill="#315f82" font-size="12" font-weight="700">Individual record</text>
    <text x="383" y="148" text-anchor="middle" fill="#60747d" font-size="10">clinical resources</text>
    <rect x="307" y="171" width="152" height="45" rx="6" fill="#ffffff" stroke="#91adbd"/>
    <text x="383" y="191" text-anchor="middle" fill="#315f82" font-size="12" font-weight="700">Biosample record</text>
    <text x="383" y="207" text-anchor="middle" fill="#60747d" font-size="10">Specimen + linked observations</text>
    <text x="383" y="233" text-anchor="middle" fill="#60747d" font-size="10">relative &#183; absolute &#183; URN references</text>

    <path d="M480 156H528" fill="none" stroke="#60747d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="536" y="50" width="160" height="213" rx="7" fill="#eff9f3" stroke="#58a27b" stroke-width="2"/>
    <rect x="557" y="76" width="118" height="45" rx="6" fill="#ffffff" stroke="#79b194"/>
    <text x="616" y="104" text-anchor="middle" fill="#276749" font-size="14" font-weight="700">BFF JSON</text>
    <rect x="557" y="134" width="118" height="45" rx="6" fill="#fff7f2" stroke="#df825f"/>
    <text x="616" y="162" text-anchor="middle" fill="#a84f30" font-size="14" font-weight="700">PXF JSON</text>
    <rect x="557" y="192" width="118" height="45" rx="6" fill="#f3f8fb" stroke="#6d98b4"/>
    <text x="616" y="220" text-anchor="middle" fill="#315f82" font-size="14" font-weight="700">OMOP CSV</text>
  </g>
</svg>
